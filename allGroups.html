<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All groups</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>
        List of the groups
    </h1>

    <button onclick="window.location.href = 'allmemberlist.html';">List of the members</button><br>

    <p id="counter"></p>
    <table id="tableGroups">
        <thead>
            <tr>
                <th onclick="">Groupname</th>
                <th onclick="">Fandom</th>
                <th onclick="">Size</th>
                <th onclick="">Debut</th>
                <th onclick="">Disband</th>
            </tr>
            <tr id="filterRow">
                <td><input type="text" id="filterGroup" class="filter-input" placeholder="group"></td>
                <td><input type="text" id="filterFandom" class="filter-input" placeholder="fandom"></td>
                <td><input type="text" id="filterSize" class="filter-input" placeholder="size"></td>
                <td><input type="text" id="filterDebut" class="filter-input" placeholder="debutdate"></td>
                <td><input type="text" id="filterDisband" class="filter-input" placeholder="disbanddate"></td>
            </tr>
        </thead>
        <tbody id="tableBody">

        </tbody>
    </table>

    <script src="memberlist.js"></script>
    <script src="allGroups.js"></script>
</body>
</html>
