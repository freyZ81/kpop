<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member competition</title>
    <style>
        img {
            height: 200px;
            width: 150px;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>
        Member competition
    </h1>

    <form>
        <label for="gender">Choose the gender:</label>
        <select name="gender" id="genderChoose">
            <option value="girls">Girls</option>
            <option value="boys">Boys</option>
            <option value="girlsAndBoys">Girls and Boys</option>
        </select>
    </form>
    <form>
        <label for="countMaxSize">How many members do you want:</label>
        <select name="countMaxSize" id="countMaxSize">
            <option value="64">64</option>
            <option value="32">32</option>
            <option value="16" selected>16</option>
            <option value="8">8</option>
            <option value="4">4</option>
            <option value="2">2</option>
        </select>
    </form>

    <br>

    <button id="newRound" onclick="newRound()">New round</button>

    <br>
    <br>

    <table>
        <tr>
            <td><img id="memberOne" onclick="chooseMemberOne()" src="" alt=""></td>
            <td><img id="memberTwo" onclick="chooseMemberTwo()" src="" alt=""></td>
        </tr>
        <tr>
            <td><p id="memberOneTxt" onclick="chooseMemberOne()">Member from Group</p></td>
            <td><p id="memberTwoTxt" onclick="chooseMemberTwo()">Member from Group</p></td>
        </tr>

    </table>
    <br>
    <p id="memberleftText">test</p>

    <button onclick="window.location.href = 'allmemberlist.html';">Back to birthdaylist</button><br>

    <script src="memberlist.js"></script>
    <script src="memberCompetition.js"></script>

</body>
</html>
